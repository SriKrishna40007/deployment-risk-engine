apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: api
          image: python:latest
          securityContext:
            privileged: true

        - name: metrics
          image: nginx:latest
          securityContext:
            privileged: false
