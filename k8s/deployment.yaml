apiVersion: apps/v1
kind: Deployment
metadata:
  name: dre-demo
  labels:
    app: dre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dre-demo
  template:
    metadata:
      labels:
        app: dre-demo
    spec:
      containers:
        - name: app
          image: __IMAGE_NAME__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
